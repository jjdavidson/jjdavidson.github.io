<figure id="{{ include.id | escape }}" class="demo witness-demo" data-demo="{{ include.name | escape }}"
  data-module-src="{{ include.demo.module | relative_url }}?v={{ site.time | date: '%s' }}"
  data-proof-src="{{ include.demo.data | relative_url }}?v={{ site.time | date: '%s' }}"
  data-autoplay="{{ include.autoplay }}" aria-label="Animated coloring proof">
  <div class="panel">
    <div class="witness-panel-header witness-animation-header">
      <div class="panelTitle">Spindle-free unit distance graph is not 3-colorable.</div>
      <div class="witness-animation-case">
        <span data-role="case">Case 1</span>
        <div class="witness-pattern" data-role="pattern" role="img" aria-label="Pentagon colors"></div>
      </div>
    </div>
    <p class="witness-cycle">Pentagon: 5 → 6 → 9 → 14 → 20 → 5</p>

    <svg data-role="graph" viewBox="0 0 700 420" role="img" aria-labelledby="{{ include.id | escape }}Title {{ include.id | escape }}Description">
      <title id="{{ include.id | escape }}Title">A four-chromatic witness in Gamma alpha</title>
      <desc id="{{ include.id | escape }}Description">Vertices are numbered. Each step highlights the vertices and edges used in the deduction. Every case ends with a red edge whose endpoints must share a color.</desc>
    </svg>
    <p class="witness-error" data-role="detail" role="alert"></p>
  </div>

  {% if include.show_caption %}
  <figcaption>
    The 24-vertex witness from <a href="https://arxiv.org/abs/2610.09474">Coloring Monomial Cayley Graphs: The One-Parameter Case</a>.
    <a href="{{ include.demo.url | relative_url }}">Explore more.</a>
  </figcaption>
  {% endif %}
  <noscript><p>Enable JavaScript to watch the coloring proof.</p></noscript>
</figure>

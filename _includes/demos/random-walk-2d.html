<div id="{{ include.id | escape }}" class="demo"
     data-demo="{{ include.name | escape }}"
     data-module-src="{{ include.demo.module | relative_url }}"
     data-autoplay="{{ include.autoplay }}">
    <div class="controls">

        <label>
            <div class="row">
                <span>Total Steps</span>
            </div>
            <select id="{{ include.id | escape }}--stepsInput" data-role="stepsInput">
                <option value="25" selected>25</option>
                <option value="50">50</option>
                <option value="100">100</option>
                <option value="200">200</option>
                <option value="400">400</option>
            </select>
        </label>

        <label>
            <div class="row">
                <span>Number of Walks</span>
            </div>
            <select id="{{ include.id | escape }}--walkCount" data-role="walkCount">
                <option value="1" selected>1</option>
                <option value="10">10</option>
                <option value="100">100</option>
                <option value="500">500</option>
                <option value="1000">1000</option>
                <option value="2000">2000</option>
            </select>
        </label>

        <label>
            <div class="row">
                <span>Simulation Speed</span>
            </div>
            <select id="{{ include.id | escape }}--speedSelect" data-role="speedSelect">
                <option value="10">Slow</option>
                <option value="20" selected>Medium</option>
                <option value="40">Fast</option>
            </select>
        </label>

        <label>
            <div class="row">
                <span>View</span>
            </div>
            <select id="{{ include.id | escape }}--viewSelect" data-role="viewSelect">
                <option value="paths" selected>Paths</option>
                <option value="heat">Heat Map</option>
            </select>
        </label>

        <label class="wide">
            <div class="row">
                <span>Current Step</span>
                <span id="{{ include.id | escape }}--currentStepLabel" data-role="currentStepLabel">0</span>
            </div>
            <input id="{{ include.id | escape }}--currentStep" data-role="currentStep" type="range" min="0" max="200" step="1" value="0">
        </label>

        <button id="{{ include.id | escape }}--restartButton" data-role="restartButton">Restart</button>
        <button id="{{ include.id | escape }}--playPauseButton" data-role="playPauseButton">Play</button>
    </div>

    <div class="panels">
        <div class="panel">
            <div class="panelTitle" id="{{ include.id | escape }}--canvasTitle" data-role="canvasTitle">Random Walk Paths</div>
            <canvas id="{{ include.id | escape }}--walkCanvas" data-role="walkCanvas" width="900" height="500"></canvas>
        </div>
    </div>
</div>

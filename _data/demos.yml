triangle-free-udg:
  title: Triangle Free UDG
  description: Step through coloring proofs for triangle-free unit-distance graphs.
  markup: demos/triangle-free-udg.html
  stylesheet: /assets/demos/triangle-free-udg/style.css
  module: /assets/demos/triangle-free-udg/main.js
  presets:
    - id: "24"
      title: Davidson 24
      vertices: 24
      data: /assets/demos/triangle-free-udg/data/witness.json
    - id: "21"
      title: Davidson 21
      vertices: 21
      data: /assets/demos/triangle-free-udg/data/witness-21.json
      guide:
        - In a proper 3-coloring of a four-cycle, at least one pair of opposite vertices must share a color.
        - Start with 10–11–14–13. Case 1 takes the diagonal 10–14. If those colors differ, 11 and 13 must match, giving Case 2. Apply the same rule to 0–1–5–4. Case 2a takes the diagonal 0–5, and Case 2b takes 1–4.
    - id: "20"
      title: Davidson 20
      vertices: 20
      data: /assets/demos/triangle-free-udg/data/witness-20.json
      guide:
        - In the four-cycle 2–0–4–11, at least one pair of opposite vertices must share a color. Case 1 makes 2 and 4 match. Otherwise 0 and 11 match, giving Case 2.
        - In Case 2, the class {0, 11} and vertices 4, 5, and 12 form a four-cycle of color classes. The edge 11–12 closes it. Case 2a makes 5 match {0, 11}, and Case 2b makes 4 and 12 match.
    - id: ei21
      title: Exoo–Ismailescu 21
      vertices: 21
      data: /assets/demos/triangle-free-udg/data/exoo-ismailescu-21.json
      guide:
        - Every three-coloring of the base makes at least one of the triples {0, 1, 2} and {3, 4, 5} monochromatic. Of the sixteen colorings up to renaming, six make only the first triple match, six make only the second match, and four make both match.
        - Case 1 uses the pentagon attached to {0, 1, 2}. Case 2 uses the pentagon attached to {3, 4, 5}. Either pentagon needs a third color that its attached triple forbids.
      source: https://www.cs.rit.edu/~spr/COURSES/CCOMP/soifer.pdf#page=182
    - id: ei19
      title: Exoo–Ismailescu 19
      vertices: 19
      data: /assets/demos/triangle-free-udg/data/exoo-ismailescu-19.json
      guide:
        - In all ten three-colorings of the base graph, up to renaming colors, vertices 0, 1, and 2 have the same color.
        - Each vertex of the attached pentagon touches one of these three vertices. The pentagon must alternate between the two remaining colors, which fails on the closing edge.
      source: https://www.cs.rit.edu/~spr/COURSES/CCOMP/soifer.pdf#page=186
    - id: ei17
      title: Exoo–Ismailescu 17
      vertices: 17
      data: /assets/demos/triangle-free-udg/data/exoo-ismailescu-17.json
      guide:
        - In the four-cycle 2–14–9–16, at least one pair of opposite vertices must share a color. Case 1 makes 2 and 9 match. If they differ, 14 and 16 must match, giving Case 2.
      source: https://www.cs.rit.edu/~spr/COURSES/CCOMP/soifer.pdf#page=190
  url: /simulations/moncay/triangle-free-udg/
  category: Monomial Cayley Graphs
  tags:
    - cayley-graphs
    - graph-coloring
    - research
  autoplay: true

